name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Flet
        run: pip install flet
        
      - name: Build APK
        run: yes | flet build apk --python-version 3.12
        
      - name: Rename APK
        # 👇 核心修改：自动搜索所有 .apk 文件并重命名
        run: |
          find build -name "*.apk" -exec mv {} "build/米重换算.apk" \;
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          # 👇 上传我们重命名好的中文文件
          path: "build/米重换算.apk"
