name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install latest Flet
        run: pip install --upgrade flet
        
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
        
      - name: Build APK
        run: yes | flet build apk --python-version 3.12
        
      - name: Rename APK
        run: find build -name "*.apk" -exec mv {} "build/米重换算.apk" \;
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: "build/米重换算.apk"
