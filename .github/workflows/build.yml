name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Java 升级到 v4 版本
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: pip install --upgrade flet

      # 👇 核心修复：彻底放弃第三方 SDK 插件，直接通过系统环境强制接受所有协议
      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find ${ANDROID_HOME} -name sdkmanager | head -n 1)
          yes | $SDKMANAGER --licenses || true

      - name: Build APK
        run: yes | flet build apk --python-version 3.12

      - name: Rename APK
        run: find build -name "*.apk" -exec mv {} "build/米重换算.apk" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: "build/米重换算.apk"
